<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>FormFiller — fill PDF forms the easy way</title>
  <meta name="description" content="Free PDF form filler. Upload a PDF, fill in a clean, simple form, and save the filled-in PDF. Everything happens on your device.">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" id="brand" aria-label="FormFiller">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="2" width="22" height="28" rx="5" fill="var(--accent)"/><rect x="8" y="9" width="12" height="2.6" rx="1.3" fill="#fff"/><rect x="8" y="15" width="8" height="2.6" rx="1.3" fill="#fff" opacity=".75"/><path d="M17.5 25.5l9.6-9.6a2.2 2.2 0 013.1 3.1l-9.6 9.6-4 .9z" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.6"/></svg>
      <span>FormFiller</span>
      <span class="version" id="version"></span>
    </a>
    <div class="top-actions">
      <button class="btn ghost small" id="installBtn" hidden data-i18n="install"></button>
      <button class="btn ghost small" id="langBtn"></button>
    </div>
  </header>

  <!-- HOME -->
  <main id="home" class="view">
    <section class="hero">
      <p class="eyebrow" data-i18n="tagline"></p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="lead" data-i18n="heroSub"></p>

      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
        <svg class="dz-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 6h14l10 10v24a4 4 0 01-4 4H14a4 4 0 01-4-4V10a4 4 0 014-4z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M28 6v10h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 36V22m-6 6l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn primary big" data-i18n="choose"></span>
        <span class="dz-hint" data-i18n="dropHint"></span>
      </label>

      <div class="samples">
        <span data-i18n="trySample"></span>
        <button class="chip" data-sample="samples/sample-fillable.pdf" data-i18n="sampleFillable"></button>
        <button class="chip" data-sample="samples/sample-printed.pdf" data-i18n="sampleFlat"></button>
      </div>
    </section>

    <section class="features">
      <div class="feature"><div class="f-icon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><h3 data-i18n="featPrivate"></h3><p data-i18n="featPrivateText"></p></div>
      <div class="feature"><div class="f-icon"><svg viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg></div><h3 data-i18n="featFree"></h3><p data-i18n="featFreeText"></p></div>
      <div class="feature"><div class="f-icon"><svg viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0"/><circle cx="12" cy="19.5" r="1"/><path d="M3 3l18 18"/></svg></div><h3 data-i18n="featOffline"></h3><p data-i18n="featOfflineText"></p></div>
    </section>
<div class="share-app-wrap" style="text-align:center;margin:18px 0 8px"><button type="button" class="share-app-btn" style="display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;cursor:pointer;opacity:.85"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>Share this app</span></button></div>
    <footer class="foot">
      <span data-i18n="footer"></span> · <span class="version-text"></span>
      <br><button class="linkish" id="forgetBtn" data-i18n="forgetAnswers"></button>
    </footer>
  </main>

  <!-- FILL -->
  <main id="fill" class="view" hidden>
    <div class="docbar">
      <div class="doc-meta">
        <div class="doc-name" id="docName"></div>
        <div class="doc-sub"><span id="docCount"></span><span class="dot">·</span><span id="docProgressText"></span></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <button class="btn ghost small" id="newBtn" data-i18n="startOver"></button>
      <button class="btn primary small" id="saveBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14"/></svg><span data-i18n="savePdf"></span></button>
    </div>
    <div id="notices" class="notices"></div>
    <div class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="pdf"><svg viewBox="0 0 24 24" class="ico"><path d="M7 3h7l5 5v12a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span data-i18n="tabPdf"></span></button>
      <button role="tab" class="tab" data-tab="list"><svg viewBox="0 0 24 24" class="ico"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span data-i18n="tabList"></span></button>
    </div>

    <section class="pdf-view" id="pdfView">
      <div class="stage" id="stage">
        <div id="pagesBox" class="pages-box"></div>
      </div>
      <div class="stage-tools">
        <button class="tool" id="undoBtn" data-i18n-aria="undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
        <button class="tool" id="redoBtn" data-i18n-aria="redo" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
        <span class="tool-sep"></span>
        <button class="tool" id="zoomOut" data-i18n-aria="zoomOut"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <button class="tool zoom-label" id="zoomLabel" data-i18n-aria="zoomFit">100%</button>
        <button class="tool" id="zoomIn" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
        <span class="tool-sep"></span>
        <button class="tool" id="selBtn" data-i18n-aria="mergeBoxes"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="7" height="8" rx="1.5" stroke-dasharray="2 2"/><rect x="14" y="8" width="7" height="8" rx="1.5" stroke-dasharray="2 2"/><path d="M10 12h4"/></svg></button>
        <button class="tool" id="markBtn" data-i18n-aria="erase"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M5 12h9" stroke-dasharray="1.5 2"/></svg></button>
        <button class="tool" id="inkBtn" data-i18n-aria="textColor"><span class="ink-dot" id="inkDot"></span></button>
        <button class="tool" id="addBtn" data-i18n-aria="addField"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="2"/><path d="M12 10v4M10 12h4"/></svg></button>
      </div>
      <div class="ink-pop" id="inkPop" hidden>
        <div class="ink-title" data-i18n="textColor"></div>
        <div class="ink-swatches" id="inkSwatches"></div>
        <label class="ink-custom"><input type="color" id="inkCustom"><span data-i18n="customColor"></span></label>
      </div>
      <div class="add-mode" id="markMode" hidden>
        <label class="mark-select"><span class="sr" data-i18n="eraseStyle"></span>
          <select id="markStyle">
            <option value="strike1" data-i18n="mkStrike1"></option>
            <option value="strike2" data-i18n="mkStrike2"></option>
            <option value="strike3" data-i18n="mkStrike3"></option>
            <option value="scribble" data-i18n="mkScribble"></option>
            <option value="hatch" data-i18n="mkHatch"></option>
            <option value="blur" data-i18n="mkBlur"></option>
            <option value="cover" data-i18n="mkCover"></option>
          </select>
        </label>
        <div class="cover-colors" id="coverColors" hidden>
          <button class="cc-chip auto" data-cover="auto" data-i18n="coverAuto"></button>
          <button class="cc-sw" data-cover="#ffffff" style="background:#ffffff" data-i18n-aria="colWhite"></button>
          <button class="cc-sw" data-cover="#e6e6e6" style="background:#e6e6e6" data-i18n-aria="colGrey"></button>
          <button class="cc-sw" data-cover="#000000" style="background:#000000" data-i18n-aria="colBlack"></button>
          <button class="cc-sw" data-cover="#ffe14d" style="background:#ffe14d" data-i18n-aria="colYellow"></button>
          <label class="cc-pick" data-i18n-aria="customColor"><input type="color" id="coverCustom" value="#ffffff"></label>
          <button class="cc-pipette" id="pipetteBtn" data-i18n-aria="pipette"><svg viewBox="0 0 24 24"><path d="M19.4 4.6a2.1 2.1 0 00-3 0l-2.2 2.2-1.1-1.1-1.4 1.4 1.1 1.1-7.3 7.3V19h3.5l7.3-7.3 1.1 1.1 1.4-1.4-1.1-1.1 2.2-2.2a2.1 2.1 0 000-3z"/></svg></button>
        </div>
        <span class="mark-hint" id="markHint" data-i18n="markHint"></span>
        <button class="btn ghost small" id="markUndo" data-i18n="undo"></button>
        <button class="btn ghost small" id="markType" data-i18n="typeHere" disabled></button>
        <button class="btn primary small" id="markDone" data-i18n="done"></button>
      </div>
      <div class="add-mode" id="selMode" hidden>
        <span><b data-i18n="mergeBoxes"></b> · <span data-i18n="selectHint"></span> <span id="selCount"></span></span>
        <button class="btn primary small" id="selMerge" data-i18n="merge"></button>
        <button class="btn ghost small" id="selCancel" data-i18n="cancel"></button>
      </div>
      <div class="add-mode" id="addMode" hidden>
        <span data-i18n="addHint"></span>
        <div class="seg-group">
          <button class="seg active" data-add="text" data-i18n="addText"></button>
          <button class="seg" data-add="checkbox" data-i18n="addCheck"></button>
        </div>
        <button class="btn ghost small" id="addDone" data-i18n="cancel"></button>
      </div>

      <div class="editbar" id="editbar">
        <button class="nav-btn" id="prevBtn" data-i18n-aria="prevField"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="eb-center">
          <div class="eb-top">
            <span class="eb-label" id="ebLabel"></span>
            <span class="eb-count" id="ebCount"></span>
          </div>
          <div class="eb-slot" id="ebSlot"></div>
        </div>
        <button class="nav-btn next" id="nextBtn" data-i18n-aria="nextField"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </section>

    <section class="list-view" id="listView" hidden>
      <form id="theForm" autocomplete="on" novalidate></form>
      <div class="form-end">
        <button class="btn ghost" id="scanMoreBtn" type="button" data-i18n="scanMore"></button>
      </div>
    </section>
  </main>

  <!-- dialogs -->
  <dialog id="saveDlg" class="sheet">
    <form method="dialog" class="sheet-body" id="saveForm">
      <div class="sheet-head"><h2 data-i18n="saveTitle"></h2><button class="icon-btn" value="cancel" data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <label class="fld"><span class="fld-label" data-i18n="fileName"></span><input id="fileNameInput" type="text" autocomplete="off" spellcheck="false"></label>
      <fieldset class="fld">
        <legend class="fld-label" data-i18n="whatToSave"></legend>
        <div class="choice-cards">
          <label class="choice-card"><input type="radio" name="saveMode" value="all" checked><span class="cc-title" data-i18n="saveAll"></span><span class="cc-sub" id="saveAllText"></span></label>
          <label class="choice-card"><input type="radio" name="saveMode" value="form"><span class="cc-title" data-i18n="saveForm"></span><span class="cc-sub" id="saveFormText"></span></label>
        </div>
      </fieldset>
      <label class="switch-row"><span><span class="sr-title" data-i18n="flatten"></span><span class="sr-sub" data-i18n="flattenText"></span></span><input type="checkbox" id="flattenInput" class="switch"></label>
      <div id="saveNotes"></div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="previewBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="preview"></span></button>
        <button type="button" class="btn secondary" id="shareBtn" hidden><svg viewBox="0 0 24 24" class="ico"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span data-i18n="share"></span></button>
        <button type="button" class="btn primary" id="downloadBtn"><svg viewBox="0 0 24 24" class="ico"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14"/></svg><span data-i18n="download"></span></button>
      </div>
    </form>
  </dialog>

  <dialog id="previewDlg" class="sheet wide">
    <div class="sheet-body">
      <div class="sheet-head"><h2 data-i18n="previewTitle"></h2><button class="icon-btn" id="previewClose" data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="previewPages" class="preview-pages"></div>
    </div>
  </dialog>

  <dialog id="sigDlg" class="sheet">
    <div class="sheet-body">
      <div class="sheet-head"><h2 id="sigTitle" data-i18n="signHere"></h2><button class="icon-btn" id="sigClose" data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sig-pad big"><div class="sig-line"></div><canvas id="sigCanvas"></canvas><span class="sig-ph" data-i18n="signHere"></span></div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="sigClear" data-i18n="clear"></button>
        <button type="button" class="btn primary" id="sigUse" data-i18n="done"></button>
      </div>
    </div>
  </dialog>

  <dialog id="pwDlg" class="sheet small">
    <form method="dialog" class="sheet-body" id="pwForm">
      <h2 data-i18n="passwordTitle"></h2>
      <p class="muted" id="pwText" data-i18n="passwordText"></p>
      <label class="fld"><span class="fld-label" data-i18n="password"></span><input id="pwInput" type="password" autocomplete="current-password"></label>
      <div class="sheet-actions">
        <button class="btn secondary" value="cancel" data-i18n="cancel"></button>
        <button class="btn primary" value="ok" id="pwOk" data-i18n="open"></button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDlg" class="sheet small">
    <form method="dialog" class="sheet-body">
      <p id="confirmText"></p>
      <div class="sheet-actions">
        <button class="btn secondary" value="cancel" id="confirmCancel"></button>
        <button class="btn primary" value="ok" id="confirmOk"></button>
      </div>
    </form>
  </dialog>

  <div class="busy" id="busy" hidden><div class="spinner"></div><div id="busyText"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
<script>/* Share this app */(function(){var NAME="FormFiller",TEXT="FormFiller fills in PDF forms right on your phone.",URL0="https://khalm.github.io/FormFiller/",COPIED="Link copied \u2013 paste it in a message";function toast(m){var d=document.createElement('div');d.textContent=m;d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:14px;font:600 15px system-ui,sans-serif;z-index:2147483647;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}window.shareThisApp=async function(){var url=/github\.io$/.test(location.hostname)?new URL('./',location.href).href:URL0;if(navigator.share){try{await navigator.share({title:NAME,text:TEXT,url:url});return}catch(e){if(e&&e.name==='AbortError')return}}try{await navigator.clipboard.writeText(TEXT+' '+url);toast(COPIED)}catch(e){window.prompt('',url)}};document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('.share-app-btn');if(b){e.preventDefault();window.shareThisApp()}})})();</script>
<script>/* Auto-update: picks up new versions published to GitHub */(function(){
if(!window.fetch||!window.crypto||!crypto.subtle||!window.TextEncoder)return;
var EN=/^en/i.test(document.documentElement.lang||''),MSG=EN?'🔄 New version – tap to update':'🔄 Ny versjon – trykk for å oppdatere';
var SKIP=/\.(png|jpe?g|gif|webp|svg|ico|avif|mp3|wav|ogg|m4a|webm|mp4|woff2?|ttf|otf|json|pdf|pbf|bin|wasm|zip)$/i;
var list=null,base=null,busy=false,last=0,hiddenAt=0,touched=false,shown=false;
addEventListener('pointerdown',function(){touched=true},{capture:true,passive:true});
addEventListener('keydown',function(){touched=true},true);
function urls(){var s={},doc=location.origin+location.pathname;s[doc]=1;
 try{performance.getEntriesByType('resource').forEach(function(e){try{var u=new URL(e.name);if(u.origin===location.origin&&!SKIP.test(u.pathname)&&!/\/sw\.js$/.test(u.pathname))s[u.href]=1}catch(_){}})}catch(_){}
 return Object.keys(s)}
async function digest(fresh){var parts=await Promise.all(list.map(async function(u){try{var r=await fetch(u,fresh?{cache:'no-store'}:{});return u+'|'+r.status+'|'+(r.ok?await r.text():'')}catch(_){return null}}));
 if(parts.some(function(p){return p===null}))return null;

function editing(){var a=document.activeElement;if(a&&(a.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return true;
 var t=document.querySelectorAll('textarea,[contenteditable=""],[contenteditable="true"]');for(var i=0;i<t.length;i++){var v=t[i].value!=null?t[i].value:t[i].textContent;if(v&&v.trim()&&t[i].offsetParent)return true}return false}
async function apply(){try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.open(k).then(function(c){return Promise.all(list.map(function(u){return c.delete(u)}).concat([c.delete(location.origin+location.pathname+'index.html'),c.delete('index.html'),c.delete('./')]))})}))}catch(_){}
 await Promise.all(list.map(function(u){return fetch(u,{cache:'reload'}).catch(function(){})}));
 try{var r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(_){}
 try{sessionStorage.setItem('__auLast',String(Date.now()))}catch(_){}
 location.reload()}
function banner(){if(shown)return;shown=true;var b=document.createElement('button');b.type='button';b.textContent=MSG;
 b.style.cssText='position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2147483647;background:#1f6feb;color:#fff;border:0;border-radius:999px;padding:11px 18px;font:700 15px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;max-width:92%';
 b.onclick=function(){b.textContent='…';apply()};document.body.appendChild(b)}
async function check(){if(busy||!navigator.onLine||Date.now()-last<60000)return;busy=true;last=Date.now();
 try{if(!list)list=urls();if(!base){base=await digest(false);if(!base)return}
  var now=await digest(true);if(!now||now===base)return;
  var recent=0;try{recent=+sessionStorage.getItem('__auLast')||0}catch(_){}
  if(!touched&&!editing()&&Date.now()-recent>120000)apply();else banner()}
 catch(_){}finally{busy=false}}

</body>
</html>
